name: build-apk
on:
  push:
    branches: [inferno-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk inferno3d.apk
      - uses: actions/upload-artifact@v4
        with:
          name: inferno3d-apk
          path: inferno3d.apk
