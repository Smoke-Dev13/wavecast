name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get install -y redis-server
          pip install "./relay[ai,redis,dev]"
          cd relay && python -m pytest -q

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Android SDK уже установлен на серверах GitHub (ANDROID_HOME) — отдельный шаг установки не нужен
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # Ключ подписи — в секретах репозитория (Settings → Secrets and variables → Actions):
      #   WAVECAST_KEYSTORE_B64 (keystore в base64), WAVECAST_STORE_PASSWORD
      # Без них собирается неподписанный APK, на телефон его не поставить.
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.WAVECAST_KEYSTORE_B64 }}
          WAVECAST_STORE_PASSWORD: ${{ secrets.WAVECAST_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export WAVECAST_KEYSTORE="$RUNNER_TEMP/release.jks" WAVECAST_KEY_ALIAS=wavecast
          else
            echo "::warning::нет секрета WAVECAST_KEYSTORE_B64 — APK будет неподписанным"
          fi
          # ошибки — в аннотации: их видно на странице запуска без входа в GitHub
          set +e
          gradle -p android assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != 0 ]; then
            grep -E "^e: |error:|What went wrong|^> |Could not|FAILED" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$code"
          fi
          cp android/app/build/outputs/apk/release/app-release*.apk wavecast.apk
          # отпечаток подписи — на страницу запуска, чтобы сверить с ключом без скачивания APK
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if "$BT/apksigner" verify --print-certs wavecast.apk > certs.txt 2>&1; then
            echo "::notice::APK подписан, SHA-256 сертификата: $(grep -m1 'SHA-256' certs.txt | sed 's/.*: //')"
          else
            echo "::warning::APK не подписан"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wavecast-apk
          path: wavecast.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wavecast.apk

  relay-image:
    runs-on: ubuntu-latest
    needs: relay-tests
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wavecast-relay" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: relay
          push: true
          tags: ${{ env.IMAGE }}:latest
