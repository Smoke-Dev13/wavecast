*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#050202;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Inter,system-ui,sans-serif;color:#e8d3b0}

#hud.on{opacity:1}
.bar{flex:1;max-width:220px;height:12px;background:#2a0d0a;border:1px solid #6a2a18;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#e8401c;transition:width .15s}
#lvl{font-family:Cinzel,serif;font-size:15px;color:#ffb27a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sc{margin-left:auto;font-size:14px;color:#c9a888;font-variant-numeric:tabular-nums;white-space:nowrap}

#ban.on{opacity:1}

#toast.on{opacity:1}
#fl{position:absolute;inset:0;background:#c81408;opacity:0;pointer-events:none}
#touch{position:absolute;left:0;top:0;bottom:0;width:55%;display:none}
#touch.on{display:block}
#jb,#jk{position:absolute;border-radius:50%;pointer-events:none;display:none}
#jb{width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid rgba(232,211,176,.35)}
#jk{width:52px;height:52px;margin:-26px 0 0 -26px;background:rgba(255,140,80,.5)}
.btn{position:absolute;border-radius:50%;display:none;place-items:center;font-family:Cinzel,serif;font-weight:700;color:#ffe0c0;border:2px solid #ff7a3a;background:rgba(80,18,8,.55);touch-action:none}
.btn.on{display:grid}
.btn.dn{background:rgba(200,60,20,.75)}
body.gp .btn,body.gp #touch{display:none!important}
#atk{width:92px;height:92px;right:max(18px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));font-size:15px}
#jmp{width:74px;height:74px;right:calc(max(18px,env(safe-area-inset-right)) + 102px);bottom:max(14px,env(safe-area-inset-bottom));font-size:13px;border-color:#e8d3b0;background:rgba(40,30,20,.55)}

#scr.off{display:none}
.card{max-width:480px;text-align:center}
.card h1{font-family:Cinzel,serif;font-weight:700;font-size:clamp(44px,12vw,72px);line-height:1.05;margin:0 0 6px;color:#ff6a2a;letter-spacing:.06em}
.card .q{font-family:Cinzel,serif;font-style:italic;font-size:15px;color:#c9a070;margin:0 0 16px}
.card p{font-size:16px;line-height:1.55;margin:0 0 14px}
.card .h{font-size:13px;color:#a08870}
.card button{font:500 17px Inter,sans-serif;color:#1a0604;background:#ff7a3a;border:0;border-radius:10px;padding:14px 26px;min-height:48px;margin:6px;cursor:pointer}
.card button.s{background:transparent;color:#ffb27a;border:1px solid #ff7a3a}
.card button:focus-visible{outline:3px solid #ffe0c0;outline-offset:2px}
</style>
</head>

</script>
