<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191627">
<title>WaveCast</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23191627%22/%3E%3Cpath fill=%22%23BFB0F5%22 d=%22M5 10h2.4v4H5zM9 7h2.4v10H9zM13 4h2.4v16H13zM17 9h2.4v6H17z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Onest:wght@400;600;700&display=swap">
<style>
  :root { --uv: #191627; --ink: #0F0D1A; --lemon: #BFB0F5; --gum: #F0A08C; --milk: #EFEAE2; --mint: #2A2640; --dim: #9C96B0;
          --display: "Unbounded", "Arial Black", "Segoe UI Black", system-ui, sans-serif;
          --body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  html { background: var(--uv); }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--milk); font: 400 16px/1.45 var(--body);
         background: radial-gradient(120% 70% at 50% 45%, #2B2547 0%, var(--uv) 70%);
         display: flex; justify-content: center; }
  main { width: min(100%, 440px); padding: 20px 22px 28px; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { font: 800 15px/1 var(--display); color: var(--milk); letter-spacing: -.01em; }
  .pill { font: 700 13px/1 var(--body); padding: 8px 12px; border-radius: 99px;
          background: var(--mint); color: var(--dim); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .pill.live { color: var(--milk); }
  .pill.live i { background: var(--gum); animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  h1 { margin: 26px 0 6px; font: 800 clamp(38px, 14vw, 72px)/1 var(--display); letter-spacing: -.04em;
       color: var(--milk); white-space: nowrap; overflow-wrap: normal; hyphens: none; max-width: 100%; }
  h1.wrap { white-space: normal; }
  h1.squeeze { white-space: normal; overflow-wrap: anywhere; }
  #state { margin: 0; min-height: 24px; color: var(--dim); }
  #state.err { color: var(--gum); }
  .stage { position: relative; width: min(100%, 330px); aspect-ratio: 1; margin: 14px auto 6px; display: grid; place-items: center; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #btn { position: relative; width: 56%; aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer;
         background: var(--lemon); color: var(--ink); box-shadow: 0 14px 40px #0008; display: grid; place-items: center;
         transition: transform .08s, box-shadow .08s, background .15s; -webkit-tap-highlight-color: transparent; }
  #btn:active { transform: scale(.96); }
  #btn:focus-visible, .sticker:focus-visible, input:focus-visible { outline: 2px solid var(--milk); outline-offset: 4px; }
  .who input:focus-visible { outline-offset: 2px; }
  #btn svg { width: 42%; height: 42%; }
  #btn .stop { display: none; }
  #btn.on { background: var(--milk); }
  #btn.on .play { display: none; } #btn.on .stop { display: block; }
  #btn:disabled { background: var(--mint); color: var(--dim); cursor: default; box-shadow: none; }
  #hint { text-align: center; margin: 0 0 20px; font: 600 15px/1.2 var(--body); color: var(--dim); }
  .now { display: none; align-items: center; gap: 12px; margin: 0 0 18px; padding: 12px 14px; background: var(--mint); color: var(--milk);
         border-radius: 18px; }
  .now img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex: none; }
  .now a { color: inherit; text-decoration: none; min-width: 0; }
  .now > div, .now a { min-width: 0; flex: 1; }
  .now .t, .now .a { overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; word-break: normal; }
  .now .t { font: 800 16px/1.25 var(--display); letter-spacing: -.02em;
            display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
  .now .a { white-space: nowrap; } .now .a { color: var(--dim); }
  .dj { display: none; margin: 0 0 18px; padding: 12px 14px; background: var(--mint); color: var(--milk);
        border-radius: 18px 18px 18px 4px; }
  .who { display: flex; flex-direction: column; gap: 6px; margin: 0 0 18px; }
  .who label { font-size: 14px; color: var(--dim); }
  .who input { font: 600 17px/1.2 var(--body); color: var(--milk); background: var(--mint); border: 0; border-radius: 14px;
         padding: 14px 16px; width: 100%; }
  .who input::placeholder { color: var(--dim); font-weight: 400; }
  .ctl { display: flex; align-items: center; gap: 14px; }
  .ctl .vol { flex: 1; }
  .rx { display: none; align-items: center; gap: 10px; flex: none; }
  .rxw { position: relative; }
  #rxBtn, #chatBtn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--mint); font-size: 22px; line-height: 1;
           cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .08s; user-select: none; -webkit-user-select: none; }
  #rxBtn:active, #chatBtn:active { transform: scale(.92); }
  #chatBtn { position: relative; font-size: 20px; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px;
           background: var(--gum); color: var(--ink); font: 700 12px/20px var(--body); text-align: center; }
  .badge[hidden] { display: none; }
  .stack { position: absolute; bottom: 58px; left: 50%; display: flex; flex-direction: column; gap: 4px; padding: 6px; z-index: 5;
           background: var(--mint); border-radius: 30px; box-shadow: 0 14px 34px #000a;
           opacity: 0; pointer-events: none; transform-origin: bottom center; transform: translateX(-50%) translateY(10px) scale(.9);
           transition: opacity .16s, transform .16s; }
  .stack.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0) scale(1); }
  .stack button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; font-size: 26px; line-height: 1; cursor: pointer; }
  .stack button:hover, .stack button:focus-visible { background: #ffffff14; outline: none; }
  .now img { cursor: zoom-in; }
  .sheet { position: fixed; z-index: 15; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 440px);
           height: min(72vh, 600px); display: flex; flex-direction: column; background: #221E36; border-radius: 22px 22px 0 0;
           box-shadow: 0 -16px 50px #000b; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .sheet[hidden] { display: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-head b { font: 800 17px/1 var(--display); letter-spacing: -.02em; }
  .sheet-head button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--mint); color: var(--milk); font-size: 16px; cursor: pointer; }
  .msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 6px 2px; overscroll-behavior: contain; }
  .msgs .empty { color: var(--dim); text-align: center; margin: auto; font-size: 14px; padding: 0 20px; }
  .msg { align-self: flex-start; max-width: 82%; background: var(--mint); border-radius: 16px 16px 16px 6px; padding: 8px 12px;
         overflow-wrap: anywhere; }
  .msg b { display: block; font: 700 12px/1.3 var(--body); color: var(--lemon); margin-bottom: 2px; }
  .msg.host { background: var(--lemon); color: var(--ink); } .msg.host b { color: var(--ink); opacity: .7; }
  .msg.own { align-self: flex-end; border-radius: 16px 16px 6px 16px; background: #3A3460; }
  .send { display: flex; gap: 8px; margin-top: 8px; }
  .send input { flex: 1; min-width: 0; font: 500 16px/1.2 var(--body); color: var(--milk); background: var(--mint); border: 0; border-radius: 14px; padding: 12px 14px; }
  .send input::placeholder { color: var(--dim); }
  .send button { border: 0; border-radius: 14px; padding: 0 16px; background: var(--lemon); color: var(--ink); font: 700 15px/1 var(--body); cursor: pointer; }
  .hint { min-height: 16px; font-size: 12px; color: var(--gum); margin-top: 4px; }
  .viewer { position: fixed; inset: 0; z-index: 20; background: #0F0D1Af2; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 24px; gap: 6px; cursor: zoom-out; }
  .viewer[hidden] { display: none; }
  .viewer img { width: min(86vw, 64vh, 560px); aspect-ratio: 1; object-fit: cover; border-radius: 20px; box-shadow: 0 24px 60px #000c; margin-bottom: 14px; }
  .viewer .vt { font: 800 20px/1.25 var(--display); letter-spacing: -.02em; text-align: center; max-width: 86vw; }
  .viewer .va { color: var(--dim); text-align: center; max-width: 86vw; }
  @media (prefers-reduced-motion: reduce) { .stack { transition: none; } }
  .floats { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 2; }
  .floats span { position: absolute; bottom: 30%; font-size: 30px; animation: rise 2.2s ease-out forwards; }
  .floats small { display: block; font: 600 11px/1 var(--body); color: var(--dim); text-align: center; margin-top: 2px; }
  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 12% { opacity: 1; transform: translateY(-10px) scale(1); }
                    100% { transform: translateY(-190px) scale(1.1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .floats span { animation-duration: 1.2s; } }
  .vol { display: flex; align-items: center; gap: 12px; }
  .vol svg { width: 22px; height: 22px; flex: none; color: var(--dim); }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 6px; border-radius: 99px; margin: 0;
         background: var(--mint); border: 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
         background: var(--milk); border: 0; cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--milk); border: 0; cursor: pointer; }
  .tune { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 14px; color: var(--dim); }
  .tune output { width: 62px; text-align: right; }
  .foot { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .sticker { white-space: nowrap; flex: none; font: 700 15px/1 var(--body); padding: 14px 20px; border-radius: 99px; cursor: pointer;
         background: var(--mint); color: var(--milk); border: 0;
         transition: transform .08s; }
  .sticker:active { transform: scale(.96); }
  .meta { font-size: 13px; text-align: right; color: var(--dim); line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .pill.live i { animation: none; } #btn, .sticker { transition: none; } }
  /* --- главная и «не найдено» --- */
  main.site { width: min(100%, 560px); padding: 20px 24px 40px; overflow-x: clip; }
  .site header { margin-bottom: 8px; }
  .site header a { color: var(--dim); font-size: 14px; text-decoration: none; }
  .site header a:hover { color: var(--milk); }
  .hero { position: relative; padding: 28px 0 8px; }
  .hero canvas { position: absolute; z-index: 0; right: -70px; top: -20px; width: 300px; height: 300px; opacity: .9; pointer-events: none; }
  .hero > *:not(canvas) { position: relative; z-index: 1; }
  .hero h1 { white-space: normal; font-size: clamp(36px, 10vw, 58px); line-height: 1.02; margin: 0 0 16px; max-width: 13ch; }
  .lead { font-size: 18px; line-height: 1.5; color: var(--dim); margin: 0 0 28px; max-width: 34ch; }
  .join { display: flex; gap: 10px; }
  .join input { flex: 1; min-width: 0; font: 600 17px/1.2 var(--body); color: var(--milk); background: var(--mint); border: 0;
                border-radius: 99px; padding: 16px 20px; }
  .join input::placeholder { color: var(--dim); font-weight: 400; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; cursor: pointer; text-decoration: none;
         font: 700 17px/1 var(--body); padding: 16px 24px; border-radius: 99px; background: var(--lemon); color: var(--ink);
         transition: transform .08s; white-space: nowrap; }
  .btn:active { transform: scale(.96); }
  .btn:focus-visible, .join input:focus-visible { outline: 2px solid var(--milk); outline-offset: 3px; }
  .btn.quiet { background: var(--mint); color: var(--milk); }
  .note { font-size: 14px; color: var(--dim); margin: 10px 0 0; min-height: 20px; }
  .note.err { color: var(--gum); }
  section.own { margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--mint); }
  section.own h2 { font: 800 26px/1.15 var(--display); letter-spacing: -.03em; margin: 0 0 10px; }
  section.own p { color: var(--dim); line-height: 1.55; margin: 0 0 20px; max-width: 42ch; }
  ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 26px 0 0; display: grid; gap: 14px; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: baseline; line-height: 1.5; }
  ol.steps li::before { content: counter(s); font: 800 15px/34px var(--display); width: 34px; height: 34px; border-radius: 50%;
                        text-align: center; background: var(--mint); color: var(--lemon); }
  ol.steps b { color: var(--milk); font-weight: 600; }
  ol.steps span { color: var(--dim); }
  .dl { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
  .dl small { color: var(--dim); font-size: 14px; }
  footer { margin-top: 56px; color: var(--dim); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  footer a { color: var(--dim); }
  .lost { padding-top: 12vh; }
  .lost h1 { white-space: normal; margin-bottom: 14px; }
  .lost p { color: var(--dim); font-size: 18px; line-height: 1.5; margin: 0 0 28px; max-width: 32ch; }
  @media (max-width: 420px) {
    .join { flex-direction: column; }
    .hero canvas { width: 220px; height: 220px; right: -70px; top: -16px; opacity: .55; }
  }
</style>
</head>
<body>
<main class="site lost">
  <header><span class="brand">WaveCast</span></header>
  <h1>Тут пусто</h1>
  <p>Такой страницы нет. Если тебе прислали ссылку на эфир, проверь, что она скопировалась целиком — она выглядит так: <b style="color:var(--milk)">…/r/название</b></p>
  <a class="btn" href="/">На главную</a>
</main>
</body>
</html>
