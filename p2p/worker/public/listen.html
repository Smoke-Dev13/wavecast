<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110E1C">
<title>WaveCast</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23191627%22/%3E%3Cpath fill=%22%23BFB0F5%22 d=%22M5 10h2.4v4H5zM9 7h2.4v10H9zM13 4h2.4v16H13zM17 9h2.4v6H17z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700;800&family=Jura:wght@500;600;700&family=Onest:wght@400;600;700&display=swap">
<style>
  :root { --uv: #191627; --ink: #0F0D1A; --lemon: #BFB0F5; --gum: #F0A08C; --milk: #EFEAE2; --mint: #2A2640; --dim: #9C96B0;
          --display: "Unbounded", "Arial Black", "Segoe UI Black", system-ui, sans-serif;
          --body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          --tech: "Jura", "Onest", system-ui, sans-serif; --night: #07040F; --glow: #00E5FF; --neon: #FF2BD6; --volt: #F7F04A; --lv: 0;
          --glass: rgba(42,38,64,.42); --edge: rgba(239,234,226,.14); }
  * { box-sizing: border-box; }
  /* цвет свечения плавно перетекает при смене обложки */
  @property --glow { syntax: "<color>"; inherits: true; initial-value: #00E5FF; }
  @property --neon { syntax: "<color>"; inherits: true; initial-value: #FF2BD6; }
  @property --c3 { syntax: "<color>"; inherits: true; initial-value: #8A2BFF; }
  @property --c4 { syntax: "<color>"; inherits: true; initial-value: #2B6BFF; }
  html { background: var(--night); transition: --glow 2.2s ease, --neon 2.2s ease, --c3 2.2s ease, --c4 2.2s ease; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--milk); font: 400 16px/1.45 var(--body);
         background: var(--night); display: flex; justify-content: center; position: relative; }
  /* сетка осциллографа: видна у свечения и растворяется к краям */
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
         background-image: linear-gradient(rgba(191,176,245,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(191,176,245,.06) 1px, transparent 1px);
         background-size: 26px 26px; -webkit-mask-image: radial-gradient(circle at 50% 38%, #000 0, transparent 70%);
         mask-image: radial-gradient(circle at 50% 38%, #000 0, transparent 70%); }
  main { position: relative; z-index: 1; }
  .glass, .pill, .now, #rxBtn, #chatBtn, .sticker, .who input { background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  /* уголки-скобы */
  .br { position: relative; }
  .br::before, .br::after { content: ""; position: absolute; width: 11px; height: 11px; border: 0 solid rgba(191,176,245,.8); pointer-events: none; }
  .br::before { left: -1px; top: -1px; border-width: 1px 0 0 1px; }
  .br::after { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
  main { width: min(100%, 440px); padding: 20px 22px 28px; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { font: 700 17px/1 var(--tech); color: var(--milk); letter-spacing: .08em; text-transform: uppercase; }
  .pill { font: 700 13px/1 var(--tech); letter-spacing: .04em; padding: 9px 13px; border-radius: 99px;
          border: 1px solid var(--edge); color: var(--dim); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .pill.live { color: var(--milk); }
  .pill.live i { background: var(--gum); animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  h1 { margin: 26px 0 6px; font: 700 clamp(34px, 12vw, 60px)/1.02 var(--tech); letter-spacing: -.01em;
       color: var(--milk); white-space: nowrap; overflow-wrap: normal; hyphens: none; max-width: 100%; }
  h1.wrap { white-space: normal; }
  h1.squeeze { white-space: normal; overflow-wrap: anywhere; }
  #state { margin: 0; min-height: 24px; color: var(--dim); }
  #state.err { color: var(--gum); }
  /* «стучимся к ведущему» и «нет сигнала»: крупный тонкий заголовок, свечение пульсирует или гаснет */
  body[data-mode] #state { font: 300 clamp(22px, 7vw, 28px)/1.15 var(--display); letter-spacing: -.02em; color: var(--milk); min-height: 0; }
  body[data-mode] #hint { font: 500 15px/1.4 var(--body); max-width: 320px; margin-inline: auto; }
  body[data-mode="knock"] .stage::before { animation: knock 1.6s ease-in-out infinite; }
  @keyframes knock { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  body[data-mode="nosig"] .stage::before { background: var(--gum); opacity: .28; transform: translate(-50%, -50%) scale(.5); animation: none; }
  body[data-mode="nosig"]::before { opacity: .45; }
  body[data-mode="nosig"] #room { color: #C9C3D9; }
  .stage { position: relative; width: 100%; height: 270px; margin: 10px auto 6px; display: grid; place-items: center; }
  /* свечение: дышит само и разгорается от громкости */
  .stage::before { content: ""; position: absolute; left: 50%; top: 50%; width: 320px; height: 320px; border-radius: 50%;
         background: var(--glow); filter: blur(85px); pointer-events: none;
         transform: translate(-50%, -50%) scale(calc(.92 + var(--lv) * .22)); opacity: calc(.78 + var(--lv) * .22);
         animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 50% { filter: blur(95px); } }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #btn { position: relative; width: 140px; aspect-ratio: 1; border-radius: 50%; border: 1px solid rgba(239,234,226,.38); cursor: pointer;
         background: rgba(17,14,28,.38); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
         color: var(--milk); box-shadow: 0 18px 50px #0007; display: grid; place-items: center;
         transition: transform .08s, box-shadow .08s, background .15s; -webkit-tap-highlight-color: transparent; }
  #btn:active { transform: scale(.96); }
  #btn:focus-visible, .sticker:focus-visible, input:focus-visible { outline: 2px solid var(--milk); outline-offset: 4px; }
  .who input:focus-visible { outline-offset: 2px; }
  #btn svg { width: 30%; height: 30%; }
  #btn .play { margin-left: 0; }                 /* ▶ по центру: центр тяжести треугольника уже в середине значка */
  #btn .stop { display: none; }
  #btn.on { background: rgba(239,234,226,.12); }
  #btn.on .play { display: none; } #btn.on .stop { display: block; }
  #btn:disabled { background: var(--glass); color: var(--dim); border-color: var(--edge); cursor: default; box-shadow: none; }
  #hint { text-align: center; margin: 0 0 20px; font: 600 15px/1.2 var(--body); color: var(--dim); }
  .now { display: none; align-items: center; gap: 14px; margin: 0 0 18px; padding: 12px 14px; color: var(--milk);
         border: 1px solid var(--edge); border-radius: 4px; }
  .now img { width: 56px; height: 56px; border-radius: 2px; object-fit: cover; flex: none; }
  .now a { color: inherit; text-decoration: none; min-width: 0; }
  .now > div, .now a { min-width: 0; flex: 1; }
  .now .t, .now .a { overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; word-break: normal; }
  .now .t { font: 300 22px/1.12 var(--display); letter-spacing: -.03em;
            display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
  .now .a { white-space: nowrap; } .now .a { color: var(--dim); }
  .dj { display: none; margin: 0 0 18px; padding: 12px 14px; background: var(--mint); color: var(--milk);
        border-radius: 18px 18px 18px 4px; }
  .who { display: flex; flex-direction: column; gap: 6px; margin: 0 0 18px; }
  .who label { font-size: 14px; color: var(--dim); }
  .who input { font: 600 17px/1.2 var(--body); color: var(--milk); border: 1px solid var(--edge); border-radius: 14px;
         padding: 14px 16px; width: 100%; }
  .who input::placeholder { color: var(--dim); font-weight: 400; }
  .ctl { display: flex; align-items: center; gap: 14px; }
  .ctl .vol { flex: 1; }
  .rx { display: none; align-items: center; gap: 10px; flex: none; }
  .rxw { position: relative; }
  #rxBtn, #chatBtn { width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--edge); font-size: 22px; line-height: 1;
           cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .08s; user-select: none; -webkit-user-select: none; }
  #rxBtn:active, #chatBtn:active { transform: scale(.92); }
  #chatBtn { position: relative; font-size: 20px; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px;
           background: var(--gum); color: var(--ink); font: 700 12px/20px var(--body); text-align: center; }
  .badge[hidden] { display: none; }
  .stack { position: absolute; bottom: 58px; left: 50%; display: flex; flex-direction: column; gap: 4px; padding: 6px; z-index: 5;
           background: #1C1830; border: 1px solid var(--edge); border-radius: 30px; box-shadow: 0 14px 34px #000a;
           opacity: 0; pointer-events: none; transform-origin: bottom center; transform: translateX(-50%) translateY(10px) scale(.9);
           transition: opacity .16s, transform .16s; }
  .stack.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0) scale(1); }
  .stack button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; font-size: 26px; line-height: 1; cursor: pointer; }
  .stack button:hover, .stack button:focus-visible { background: #ffffff14; outline: none; }
  .now img { cursor: zoom-in; }
  .sheet { position: fixed; z-index: 15; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 440px);
           height: min(72vh, 600px); display: flex; flex-direction: column; background: #1A1729; border: 1px solid var(--edge); border-bottom: 0; border-radius: 22px 22px 0 0;
           box-shadow: 0 -16px 50px #000b; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .sheet[hidden] { display: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-head b { font: 700 17px/1 var(--tech); letter-spacing: .06em; text-transform: uppercase; }
  .sheet-head button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--mint); color: var(--milk); font-size: 16px; cursor: pointer; }
  .msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 6px 2px; overscroll-behavior: contain; }
  .msgs .empty { color: var(--dim); text-align: center; margin: auto; font-size: 14px; padding: 0 20px; }
  .msg { align-self: flex-start; max-width: 82%; background: var(--mint); border-radius: 16px 16px 16px 6px; padding: 8px 12px;
         overflow-wrap: anywhere; }
  .msg b { display: block; font: 700 12px/1.3 var(--body); color: var(--lemon); margin-bottom: 2px; }
  .msg.host { background: var(--lemon); color: var(--ink); } .msg.host b { color: var(--ink); opacity: .7; }
  .msg.own { align-self: flex-end; border-radius: 16px 16px 6px 16px; background: #3A3460; }
  .send { display: flex; gap: 8px; margin-top: 8px; }
  .send input { flex: 1; min-width: 0; font: 500 16px/1.2 var(--body); color: var(--milk); background: var(--mint); border: 0; border-radius: 14px; padding: 12px 14px; }
  .send input::placeholder { color: var(--dim); }
  .send button { border: 0; border-radius: 14px; padding: 0 16px; background: var(--lemon); color: var(--ink); font: 700 15px/1 var(--body); cursor: pointer; }
  .hint { min-height: 16px; font-size: 12px; color: var(--gum); margin-top: 4px; }
  .viewer { position: fixed; inset: 0; z-index: 20; background: #110E1Cf2; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 24px; gap: 6px; cursor: zoom-out; }
  .viewer[hidden] { display: none; }
  .viewer img { width: min(86vw, 64vh, 560px); aspect-ratio: 1; object-fit: cover; border-radius: 20px; box-shadow: 0 24px 60px #000c; margin-bottom: 14px; }
  .viewer .vt { font: 300 26px/1.15 var(--display); letter-spacing: -.03em; text-align: center; max-width: 86vw; }
  .viewer .va { color: var(--dim); text-align: center; max-width: 86vw; }
  @media (prefers-reduced-motion: reduce) { .stack { transition: none; } }
  .floats { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 2; }
  .floats span { position: absolute; bottom: 30%; font-size: 30px; animation: rise 2.2s ease-out forwards; }
  .floats small { display: block; font: 600 11px/1 var(--body); color: var(--dim); text-align: center; margin-top: 2px; }
  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 12% { opacity: 1; transform: translateY(-10px) scale(1); }
                    100% { transform: translateY(-190px) scale(1.1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .floats span { animation-duration: 1.2s; } }
  .vol { display: flex; align-items: center; gap: 12px; }
  .vol svg { width: 22px; height: 22px; flex: none; color: var(--dim); }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 6px; border-radius: 99px; margin: 0;
         background: var(--mint); border: 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
         background: var(--milk); border: 0; cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--milk); border: 0; cursor: pointer; }
  .tune { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 14px; color: var(--dim); }
  .tune output { width: 62px; text-align: right; }
  .foot { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .sticker { white-space: nowrap; flex: none; font: 700 14px/1 var(--tech); letter-spacing: .05em; text-transform: uppercase; padding: 15px 20px; border-radius: 99px; cursor: pointer;
         color: var(--milk); border: 1px solid var(--edge);
         transition: transform .08s; }
  .sticker:active { transform: scale(.96); }
  .meta { font-size: 13px; text-align: right; color: var(--dim); line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .pill.live i, .stage::before, body[data-mode="knock"] .stage::before { animation: none; } #btn, .sticker { transition: none; } }

  /* ===== Киберпанк: два неоновых сияния, неоновая волна, глитч, сканлайны ===== */
  body::before { background-image: linear-gradient(color-mix(in srgb, var(--glow) 10%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--neon) 10%, transparent) 1px, transparent 1px); }
  /* сканлайны поверх всего, как на старом экране */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 30;
         background: repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0, rgba(0,0,0,.2) 1px, transparent 1px, transparent 3px); }
  .brand { text-shadow: -1.5px 0 var(--glow), 1.5px 0 var(--neon), 0 0 14px color-mix(in srgb, var(--neon) 55%, transparent); }
  h1 { text-shadow: -2px 0 var(--glow), 2px 0 var(--neon), 0 0 18px color-mix(in srgb, var(--neon) 50%, transparent); }
  .pill.live { color: var(--volt); border-color: var(--volt); box-shadow: 0 0 12px rgba(247,240,74,.5), inset 0 0 8px rgba(247,240,74,.25); animation: flick 4s linear infinite; }
  .pill.live i { background: var(--volt); }
  @keyframes flick { 0%, 96%, 100% { opacity: 1; } 97% { opacity: .55; } 98% { opacity: 1; } 99% { opacity: .7; } }
  /* малиновое сияние слева — постоянное, второе (бирюза или цвет обложки) справа */
  .stage::before { width: 260px; height: 300px; left: 36%; background: var(--neon); filter: blur(70px); mix-blend-mode: screen;
         animation: neonA 3s ease-in-out infinite; }
  .stage::after { content: ""; position: absolute; left: 64%; top: 52%; width: 260px; height: 280px; border-radius: 50%; pointer-events: none;
         background: var(--glow); filter: blur(70px); mix-blend-mode: screen; z-index: 0;
         transform: translate(-50%, -50%) scale(calc(.92 + var(--lv) * .25)); opacity: calc(.75 + var(--lv) * .25);
         animation: neonB 3s ease-in-out -1.5s infinite; }
  @keyframes neonA { 50% { filter: blur(80px); opacity: 1; } }
  @keyframes neonB { 50% { filter: blur(80px); } }
  .stage canvas, #btn { z-index: 1; }
  body[data-mode="knock"] .stage::before, body[data-mode="knock"] .stage::after { animation: knock 1.6s ease-in-out infinite; }
  body[data-mode="nosig"] .stage::before { background: var(--neon); opacity: .22; transform: translate(-50%, -50%) scale(.5); }
  body[data-mode="nosig"] .stage::after { opacity: .12; transform: translate(-50%, -50%) scale(.4); animation: none; }
  #btn { border: 2px solid var(--neon); background: rgba(7,4,15,.72); color: #EFFBFF;
         box-shadow: 0 0 18px var(--neon), 0 0 46px color-mix(in srgb, var(--neon) 55%, transparent), inset 0 0 22px color-mix(in srgb, var(--neon) 45%, transparent); }
  #btn svg { filter: drop-shadow(0 0 6px var(--neon)); }
  #btn.on { background: rgba(7,4,15,.72); }
  #btn:disabled { border-color: var(--edge); box-shadow: none; }
  #btn:disabled svg { filter: none; }
  .now .t { color: #EFFBFF; text-shadow: 0 0 4px var(--glow), 0 0 12px var(--glow), 0 0 26px var(--glow); }
  .br::before, .br::after { border-color: var(--glow); filter: drop-shadow(0 0 4px var(--glow)); }
  #rxBtn { border-color: var(--glow); box-shadow: 0 0 12px color-mix(in srgb, var(--glow) 55%, transparent); }
  #chatBtn { border-color: var(--volt); box-shadow: 0 0 12px rgba(247,240,74,.5); }
  .sticker { border-color: var(--glow); box-shadow: 0 0 12px color-mix(in srgb, var(--glow) 45%, transparent); }
  @media (prefers-reduced-motion: reduce) { .pill.live, .stage::before, .stage::after { animation: none !important; } }

  /* ===== Живой неон: 4 цвета обложки плывут пятнами из угла в угол, мигают и вспыхивают в такт ===== */
  .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; transition: filter .22s ease-out, transform .22s ease-out; }
  .aurora i { position: absolute; left: -38vmax; top: -38vmax; width: 76vmax; height: 76vmax; border-radius: 50%;
         background: radial-gradient(circle, var(--c) 0, color-mix(in srgb, var(--c) 55%, transparent) 22%, transparent 58%);
         mix-blend-mode: screen; opacity: .5; will-change: transform, opacity; }
  .aurora i:nth-child(1) { --c: var(--neon); animation: fl1 calc(6s * var(--mv)) ease-in-out infinite alternate, blink calc(.9s * var(--bk)) ease-in-out infinite; }
  .aurora i:nth-child(2) { --c: var(--glow); animation: fl2 calc(7.5s * var(--mv)) ease-in-out infinite alternate, blink calc(1.2s * var(--bk)) ease-in-out -.5s infinite; }
  .aurora i:nth-child(3) { --c: var(--c3); animation: fl3 calc(5s * var(--mv)) ease-in-out infinite alternate, blink calc(1.05s * var(--bk)) ease-in-out -.3s infinite; }
  .aurora i:nth-child(4) { --c: var(--c4); animation: fl4 calc(8s * var(--mv)) ease-in-out infinite alternate, blink calc(1.4s * var(--bk)) ease-in-out -.8s infinite; }
  /* каждое пятно идёт своим путём через углы экрана */
  @keyframes fl1 { 0% { transform: translate(0, 0); } 33% { transform: translate(100vw, 35vh); } 66% { transform: translate(40vw, 100vh); } 100% { transform: translate(90vw, 90vh); } }
  @keyframes fl2 { 0% { transform: translate(100vw, 0); } 40% { transform: translate(10vw, 55vh); } 75% { transform: translate(80vw, 100vh); } 100% { transform: translate(0, 85vh); } }
  @keyframes fl3 { 0% { transform: translate(50vw, 100vh); } 35% { transform: translate(0, 20vh); } 70% { transform: translate(100vw, 10vh); } 100% { transform: translate(60vw, 45vh); } }
  @keyframes fl4 { 0% { transform: translate(0, 100vh); } 30% { transform: translate(70vw, 60vh); } 65% { transform: translate(95vw, 0); } 100% { transform: translate(20vw, 30vh); } }
  @keyframes blink { 0%, 100% { opacity: .14; } 40% { opacity: .78; } 55% { opacity: .5; } }
  /* вспышка на сильной доле: всё разом ярче */
  body.beat .aurora { filter: brightness(2.3) saturate(1.45); transform: scale(1.06); transition: filter .04s, transform .04s; }
  body.beat .stage::before, body.beat .stage::after { filter: blur(60px) brightness(1.6); }
  @media (prefers-reduced-motion: reduce) { .aurora i { animation: none !important; } .aurora i:nth-child(2) { transform: translate(100vw, 100vh); } body.beat .aurora { filter: none; } }

  /* ===== Темы по жанру: цвета — из обложки, характер — из жанра ===== */
  body { --mv: 1; --bk: 1; }
  .now .genre { margin-top: 6px; display: inline-block; font: 700 11px/1 var(--tech); letter-spacing: .12em; color: var(--volt);
         padding: 5px 8px; border: 1px solid color-mix(in srgb, var(--volt) 70%, transparent); box-shadow: 0 0 8px color-mix(in srgb, var(--volt) 40%, transparent); }
  .now .genre[hidden] { display: none; }
  .aurora::after { content: ""; position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .06s; }
  /* постоянный цветной слой темы (огонь у рока, тёплый свет у фолка) — отдельно, чтобы не гас вместе с фоном */
  .tint { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen; }
  /* клуб: всё носится, стробоскоп на каждом ударе */

         transform-origin: bottom; animation: fire 1.3s ease-in-out infinite alternate; }

  /* чилл: медленный дрейф, без вспышек */

  /* фолк: тёплый свет, неспешно */

  body[data-theme="warm"] .tint { opacity: .45; background: radial-gradient(90% 70% at 30% 20%, #FFB347 0, transparent 70%); mix-blend-mode: screen; }

  /* значки строго по центру круга (без влияния строк текста внутри кнопки) */

  /* ===== Глаза зверя в темноте (0.18) — как в приложении ===== */
  :root { --night: #050302; --milk: #FFF4D6; --dim: #C9B89A; --ink: #120700; --volt: #FFD37A; --gum: #FF8A5A; --mint: #2A1E12;

  .eyes { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .eyes b::before, .eyes b::after { content: ""; position: absolute; top: 0; width: 12px; height: 6px; border-radius: 50%;
          background: var(--neon); box-shadow: 0 0 8px var(--neon), 0 0 18px var(--neon); }

  body.beat .eyes b { filter: brightness(1.6); }
  .brand { text-shadow: 0 0 14px var(--glow); }
  .freq h1, body[data-theme] .freq h1, h1 { text-shadow: 0 0 18px color-mix(in srgb, var(--glow) 60%, transparent); }
  .freq .lbl { color: var(--neon); font: 600 13px/1.2 var(--tech); letter-spacing: .14em; }
  .pill.live { color: var(--neon); border-color: var(--edge); background: rgba(255,244,214,.06); box-shadow: none; animation: none; }

  /* свечение за глазом */

          opacity: calc(.38 + var(--lv) * .4); transform: translate(-50%, -50%) scale(calc(.95 + var(--lv) * .25)); animation: none; }

  #btn, #btn.on, #btn:not(.on):not(:disabled), #btn:disabled { width: min(78%, 300px); height: 150px; aspect-ratio: auto; border-radius: 50%;
          background: transparent !important; border: 0; box-shadow: none !important; -webkit-backdrop-filter: none; backdrop-filter: none; }
  #btn svg { display: none !important; }
  #hint { color: var(--neon); }
  /* что играет и плитки: округлые, с бликом, как отражение в глазу */
  .now .t { color: var(--milk); text-shadow: 0 0 14px color-mix(in srgb, var(--glow) 70%, transparent); }
  .now .cv { border-radius: 14px; overflow: hidden; box-shadow: 0 0 22px color-mix(in srgb, var(--glow) 60%, transparent); }
  .now .cv img { border-radius: 13px; }

  input[type=range] { background: var(--mint); accent-color: var(--neon); }

<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="tint" aria-hidden="true"></div>

      <svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>

    <form class="send" id="chatForm"><input id="chatInput" maxlength="200" placeholder="Написать всем…" autocomplete="off" enterkeyhint="send" aria-label="Сообщение"><button>Отправить</button></form>

</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const m = location.pathname.match(/^\/r\/([^/]+)/);
  const room = m ? decodeURIComponent(m[1]).toLowerCase() : '';
  const audio = $('audio');
  let ws, pc, ice = [], live = false, wanted = false, retry = 500, rejoin, fatal = false, analyser, bins;
  let asked = false, waiting = false, dc = null, lastReact = 0, blocked = false;
  const EMOJI = ['🔥', '❤️', '😂', '👏', '🎉', '😍'];
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch {} return null; };
  // id устройства: чтобы после обрыва связи ведущему не приходил повторный запрос
  let cid = store('wc-cid');
  if (!cid) { cid = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(36).padStart(2, '0')).join('').slice(0, 20); store('wc-cid', cid); }
  $('name').value = store('wc-name') || '';
  const myName = () => $('name').value.trim().slice(0, 24) || 'Гость';
  const join = () => send({ type: 'join', name: myName(), cid });

  // Глаз зверя вместо кнопки: как в приложении.
  // Не слушаем — глаз дремлет (узкая щель), слушаем — открыт, взгляд гуляет,
  // зрачок расширяется от громкости и дёргается на сильных долях, глаз иногда моргает.
  // body[data-mode=knock] — глаз приоткрыт и ждёт (стучимся к ведущему),
  // body[data-mode=nosig] — глаз закрыт и почти погас (не пустили)
  function ring(cv, getData) {
    const g = cv.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const host = cv.parentElement, btn = document.getElementById('btn');
    let lv = 0, avg = 0, lastBeat = 0, open = 0.16, bp = 0, blinkAt = -1e9, nextBlink = performance.now() + 3000;
    const t0 = performance.now();
    const E = () => window.__eye || { iris: '#F5B700', glow: '#C77700', rim: '#8A3C00', alt: '#7FE3FF', round: true };
    const mix = (hex, k) => {                                      // радужка ближе к зрачку — светлее
      const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (255 - v) * k));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    };
    function almond(cx, cy, a, hh) {
      g.beginPath(); g.moveTo(cx - a, cy);
      g.bezierCurveTo(cx - a * .45, cy - hh * 1.33, cx + a * .45, cy - hh * 1.33, cx + a, cy);
      g.bezierCurveTo(cx + a * .45, cy + hh * 1.33, cx - a * .45, cy + hh * 1.33, cx - a, cy); g.closePath();
    }
    function frame() {
      const dpr = Math.min(devicePixelRatio || 1, 2), w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      const mode = document.body.dataset.mode, data = mode ? null : getData(), now = performance.now(), t = (now - t0) / 1000;
      let loud = 0;
      if (data) { let s = 0; const n = Math.min(64, data.length); for (let i = 2; i < n; i++) s += data[i]; loud = s / (n - 2) / 255; }
      lv += (loud - lv) * 0.2;
      host.style.setProperty('--lv', lv.toFixed(3));
      // сильная доля: громкость резко выше средней
      avg += (loud - avg) * 0.05;
      const th = document.body.dataset.theme;
      const gap = { club: 120, night: 320, warm: 320, dark: 300, street: 260 }[th] || 160;
      if (!still && data && th !== 'calm' && loud - avg > (th === 'club' ? 0.04 : 0.05) && loud > 0.08 && now - lastBeat > gap) {
        lastBeat = now; bp = 1; document.body.classList.add('beat'); setTimeout(() => document.body.classList.remove('beat'), 110);
      }
      bp *= 0.86;
      const e = E();
      host.style.setProperty('--btn', e.iris);
      // насколько открыт глаз
      const on = btn && btn.classList.contains('on');
      const want = mode === 'nosig' ? 0.02 : mode === 'knock' ? 0.42 + 0.08 * Math.sin(t * 3) : (on || loud > 0.01) ? 1 : 0.16 + 0.04 * Math.sin(t * 1.3);

      g.save(); g.globalAlpha = dim; g.strokeStyle = e.iris; g.lineWidth = 6 * dpr; g.shadowColor = e.iris;
      g.shadowBlur = (16 + Math.max(lv, bp * 0.6) * 26) * dpr; g.stroke(); g.restore();

      g.fillStyle = '#0A0603'; g.fillRect(cx - a, cy - hh * 1.4, a * 2, hh * 2.8);
      const R = hb * 1.12, ix = cx + (still ? 0 : Math.sin(t * 0.6) * R * 0.09), iy = cy + (still ? 0 : Math.sin(t * 0.43 + 1) * R * 0.05);
      const rg = g.createRadialGradient(ix, iy, 0, ix, iy, R), inner = mix(e.iris, 0.45);
      rg.addColorStop(0, inner); rg.addColorStop(0.26, inner); rg.addColorStop(0.62, e.iris); rg.addColorStop(0.9, e.rim); rg.addColorStop(1, '#0A0400');

      lg.addColorStop(0, 'rgba(0,0,0,.8)'); lg.addColorStop(0.32, 'rgba(0,0,0,0)'); lg.addColorStop(0.72, 'rgba(0,0,0,0)'); lg.addColorStop(1, 'rgba(0,0,0,.6)');

  const setState = (txt, err) => { $('state').textContent = txt; $('state').className = err ? 'err' : ''; };
  const setLive = (on, n) => {
    $('pill').className = 'pill' + (on ? ' live' : '');
    if (!on) $('cnt').textContent = 'не в эфире';
    else if (n != null) {
      const w = n % 10 === 1 && n % 100 !== 11 ? 'слушает' : 'слушают';
      $('cnt').textContent = n + ' ' + w; $('tListen').textContent = n; $('tListenL').textContent = w;
    }
    else if ($('cnt').textContent === 'не в эфире') $('cnt').textContent = 'в эфире';
  };
  const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

  if (!room) { setState('Открой ссылку на эфир, которую прислал ведущий'); $('btn').disabled = true; $('hint').textContent = ''; return; }
  $('room').textContent = room;

  // Название эфира никогда не рвём посреди слова:
  //  1) одна строка, уменьшаем шрифт до 26px;
  //  2) не влезло — переносим только по дефису/пробелу и уменьшаем до 18px;
  //  3) и это не помогло (48 символов без дефисов) — только тогда перенос где угодно.
  // Пересчитываем при подгрузке шрифта и при любом изменении ширины.
  function fitTitle() {
    const h = $('room'), cs = getComputedStyle(h.parentElement), box = h.parentElement.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (!box) return;                                   // страница скрыта — посчитаем, когда покажут
    const fits = () => h.scrollWidth <= box + 1;
    h.className = ''; h.style.fontSize = '';
    let size = parseFloat(getComputedStyle(h).fontSize);
    while (!fits() && size > 26) { size -= 1; h.style.fontSize = size + 'px'; }
    if (fits()) return;
    h.className = 'wrap';
    while (!fits() && size > 18) { size -= 1; h.style.fontSize = size + 'px'; }
    if (!fits()) h.className = 'squeeze';
  }
  if ('ResizeObserver' in window) new ResizeObserver(() => fitTitle()).observe(document.querySelector('main'));
  else addEventListener('resize', fitTitle);
  if (document.fonts) { document.fonts.addEventListener('loadingdone', fitTitle); document.fonts.ready.then(fitTitle); }
  fitTitle();
  document.title = room + ' — WaveCast';

  // Opus по умолчанию моно и ~32 кбит/с: просим у ведущего стерео и музыкальный битрейт
  const musicSdp = sdp => sdp.replace(/a=fmtp:(\d+) (.*useinbandfec=1[^\r\n]*)/g,
    (s, pt, rest) => /stereo=1/.test(rest) ? s : `a=fmtp:${pt} ${rest};stereo=1;sprop-stereo=1;maxaveragebitrate=160000`);

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/signal/' + encodeURIComponent(room) + '?role=listener');
    ws.onopen = () => { retry = 500; if (asked) join(); };
    ws.onclose = () => {
      if (fatal) return;
      if (!blocked && (!pc || pc.connectionState !== 'connected')) setState('Нет связи с сервисом, переподключаюсь…');
      setTimeout(connect, retry); retry = Math.min(retry * 2, 8000);
    };
    ws.onmessage = ev => onSignal(JSON.parse(ev.data)).catch(e => console.warn('signal', e));
  }

  async function onSignal(d) {
    switch (d.type) {
      case 'hello':
        ice = d.iceServers || []; live = d.live;
        if (blocked) break;
        if (!pc || pc.connectionState !== 'connected') {
          setLive(live);
          setState(!live ? 'Эфир ещё не начался. Страница сама подключится, когда ведущий выйдет.'
                   : waiting ? 'Стучимся к ведущему…' : asked ? 'Ведущий в сети, соединяюсь…' : 'Эфир идёт. Представься и жми «Слушать»');
        }
        break;
      case 'offer': {
        waiting = false; $('who').style.display = 'none'; ui();
        drop();
        const p = pc = new RTCPeerConnection({ iceServers: ice });
        p.onicecandidate = e => { if (e.candidate) send({ type: 'ice', candidate: e.candidate }); };
        p.ontrack = e => { audio.srcObject = e.streams[0] || new MediaStream([e.track]); if (wanted) play(); };
        p.ondatachannel = e => {   // канал от ведущего: что играет и реакции
          dc = e.channel;
          dc.onopen = () => { $('reacts').style.display = 'flex'; $('chatBtn').style.display = ''; $('tiles').hidden = false; };
          dc.onclose = () => { $('reacts').style.display = 'none'; $('chatBtn').style.display = 'none'; $('tiles').hidden = true; };
          dc.onmessage = m => { try { onData(JSON.parse(m.data)); } catch {} };
        };
        p.onconnectionstatechange = () => { if (p === pc) onLink(p.connectionState); };
        await p.setRemoteDescription(d);
        const ans = await p.createAnswer();
        ans.sdp = musicSdp(ans.sdp);
        await p.setLocalDescription(ans);
        send({ type: 'answer', sdp: ans.sdp });
        break;
      }
      case 'ice':
        if (pc && d.candidate) await pc.addIceCandidate(d.candidate).catch(() => {});
        break;
      case 'status':
        live = d.live !== false;
        if (!live && !blocked) { drop(); waiting = false; Chat.reset(); $('now').style.display = 'none'; setLive(false); setState('Эфир закончился. Останься на странице — подключу, когда ведущий вернётся.'); }
        else if (pc && pc.connectionState === 'connected') setLive(true, d.listeners);
        ui();
        break;
      case 'waiting':
        waiting = true; setState('Стучимся к ведущему…'); ui();
        break;
      case 'denied':
        asked = false; waiting = false; wanted = false; blocked = true; drop(); silence(); Chat.reset();
        setState('Ведущий не пустил'); $('who').style.display = ''; ui();
        break;
      case 'busy':
        asked = false; waiting = false; wanted = false;
        setState('У ведущего сейчас много запросов. Попробуй через минуту.', true); ui();
        break;
      case 'kicked':
        asked = false; waiting = false; wanted = false; blocked = true; drop(); silence(); showTrack(null); Chat.reset();
        setState('Ведущий отключил тебя'); $('who').style.display = ''; ui();
        break;
      case 'full':
        setState('Мест нет: у ведущего максимум слушателей. Попробуй позже.', true);
        break;
      case 'error':
        fatal = true; setState(d.message || 'Ошибка сервиса', true);
        break;
    }
  }

  function onLink(st) {
    clearTimeout(rejoin);
    if (st === 'connected') { setLive(true); setState(wanted ? 'Ты в эфире' : 'Эфир идёт'); report(); }
    else if (st === 'disconnected') { setState('Связь прервалась, жду…'); rejoin = setTimeout(join, 4000); }
    else if (st === 'failed') { $('link').textContent = ''; setState('Напрямую соединиться не вышло, пробую ещё…', true); rejoin = setTimeout(join, 1500); }
  }

  // показываем, идёт ли звук напрямую или через TURN-ретранслятор
  async function report() {
    try {
      const st = await pc.getStats(); let pair;
      st.forEach(r => { if (r.type === 'transport' && r.selectedCandidatePairId) pair = st.get(r.selectedCandidatePairId); });
      const loc = pair && st.get(pair.localCandidateId);
      $('link').textContent = loc && loc.candidateType === 'relay' ? 'звук идёт через TURN' : 'звук идёт напрямую';
    } catch {}
  }

  // отказ или отключение: глушим плеер, чтобы не висела «играющая» пустая дорожка
  function silence() { audio.pause(); audio.srcObject = null; }

  function drop() {
    clearTimeout(rejoin);
    if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
    dc = null; $('reacts').style.display = 'none'; $('chatBtn').style.display = 'none'; $('tiles').hidden = true; $('link').textContent = '';
  }

  function onData(d) {
    if (d.type === 'track') showTrack(d.title ? d : null);
    if (d.type === 'chat') { Chat.message(d); $('tMsg').textContent = +$('tMsg').textContent + 1; }
    if (d.type === 'chat-history') { Chat.history(d.items); $('tMsg').textContent = Array.isArray(d.items) ? d.items.length : 0; }
    if (d.type === 'react' && EMOJI.includes(d.e)) float(d.e, d.name);
  }

  // Оформление по треку — общее для страницы по ссылке и по Wi-Fi.
  // Жанр (присылает ведущий) задаёт зверя: цвета глаза и форму зрачка, как в приложении.
  // Жанр не найден — фирменные глаза: янтарный волк.
  // палитра [радужка, свечение, ободок, глаза вдали] → CSS-переменные и window.__eye (по ней рисуется глаз)

  }
  const PALETTES = {
    club:   ['#2EE88A', '#119C5E', '#0B5A3A', '#E8FF7A'],    // кошка: изумруд
    street: ['#D8FF3A', '#8AA800', '#3A4A00', '#FF7A1A'],    // рептилия: кислотно-жёлтый
    rock:   ['#FFB000', '#FF5A00', '#7A2A00', '#FFE27A'],    // волк: золото и огонь
    dark:   ['#E0122E', '#8A0018', '#3A0008', '#FF5A1F'],    // хищник в темноте: кровь, бордо
    pop:    ['#FF7A1A', '#FF4F6E', '#7A2400', '#3FE6D8'],    // лиса: рыжий
    night:  ['#FF9A1F', '#7A3CFF', '#6A2A00', '#FFD37A'],    // сова: медовый на фиолетовой ночи
    calm:   ['#E8B45A', '#3FA8C8', '#5A3A10', '#9FE8E0'],    // олень: мёд, вода
    warm:   ['#FF8A00', '#FFB347', '#7A2000', '#FFE08A'],    // тигр: огненный
  };
  const ROUND = { rock: 1, night: 1, calm: 1, warm: 1 };     // круглый зрачок; у остальных — щель
  const BRAND = ['#F5B700', '#C77700', '#8A3C00', '#7FE3FF'];
  const THEMES = Object.keys(PALETTES);
  function look(t) {
    const id = t && THEMES.includes(t.theme) ? t.theme : '';
    if (id) document.body.dataset.theme = id; else delete document.body.dataset.theme;
    const g = $('genre'); g.hidden = !id; g.textContent = id ? String(t.genre || '').slice(0, 24) : '';
    palette(id ? PALETTES[id] : BRAND, id ? ROUND[id] : true);
  }
  palette(BRAND, true);
  // глаза вдали: пары огоньков проступают из темноты, моргают и гаснут
  (function () {
    const box = document.createElement('div'); box.className = 'eyes'; box.setAttribute('aria-hidden', 'true');
    const spots = [[86, 19, 0], [4, 41, 3.1], [90, 55, 6.2], [5, 74, 1.6], [88, 88, 4.4], [46, 97, 8.1]];
    spots.forEach(([x, y, d], i) => {
      const e = document.createElement('b'); e.className = i % 2 ? 'alt' : '';
      e.style.cssText = `left:${x}%;top:${y}%;animation-delay:-${d}s;animation-duration:${9 + i * 1.3}s`;
      box.appendChild(e);
    });
    document.body.prepend(box);
  })();
  function showTrack(t) {
    $('now').style.display = t ? 'flex' : 'none';
    look(t);
    if (!t) { document.title = room + ' — WaveCast'; if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: room, artist: 'WaveCast' }); return; }
    $('title').textContent = $('title').title = t.title;
    $('artist').textContent = $('artist').title = t.artist || '';
    const okCover = /^data:image\/(jpeg|png|webp);base64,/.test(t.cover || '');
    $('cover').style.display = okCover ? 'block' : 'none';
    if (okCover) $('cover').src = t.cover;

    if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title, artist: t.artist || '', album: 'WaveCast · ' + room,

  }

  // летящая реакция над кнопкой
  function float(e, name) {
    const box = $('floats');
    if (box.childElementCount > 24) return;
    const el = document.createElement('span');
    el.textContent = e;
    $('tReact').textContent = +$('tReact').textContent + 1;
    if (name) { const n = document.createElement('small'); n.textContent = name.slice(0, 12); el.appendChild(n); }
    el.style.left = (15 + Math.random() * 62) + '%';

  // Реакции: одна кнопка, по нажатию над ней всплывает стопка смайликов (как в YouTube).
  // На кнопке остаётся последняя реакция; долгое нажатие отправляет её ещё раз без стопки.
  function setupReactions(send) {
    const btn = $('rxBtn'), stack = $('stack');
    let last = null, timer = null, longFired = false;
    const open = on => { stack.classList.toggle('open', on); btn.setAttribute('aria-expanded', on); };
    const fire = e => {
      if (!send(e)) return;
      float(e); last = e; btn.textContent = e;
      if (navigator.vibrate) navigator.vibrate(12);
    };
    for (const e of EMOJI) {
      const b = document.createElement('button');
      b.textContent = e; b.setAttribute('role', 'menuitem'); b.setAttribute('aria-label', 'Реакция ' + e);
      b.onclick = ev => { ev.stopPropagation(); open(false); fire(e); };
      stack.appendChild(b);
    }
    btn.addEventListener('pointerdown', () => {
      longFired = false;
      if (last) timer = setTimeout(() => { longFired = true; open(false); fire(last); }, 450);
    });
    for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, () => clearTimeout(timer));
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.onclick = ev => {
      ev.stopPropagation();
      if (longFired) { longFired = false; return; }
      open(!stack.classList.contains('open'));
    };
    document.addEventListener('click', ev => { if (!stack.contains(ev.target)) open(false); });
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape') open(false); });
  }

  // Обложка крупно поверх страницы: нажатие на обложку открывает, нажатие или «Назад» — закрывает
  function setupViewer() {
    const v = $('viewer');
    const fill = () => { $('viewerImg').src = $('cover').src; $('viewerT').textContent = $('title').textContent; $('viewerA').textContent = $('artist').textContent; };
    const close = () => { if (v.hidden) return; v.hidden = true; if (history.state && history.state.viewer) history.back(); };
    $('cover').addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      if (!$('cover').getAttribute('src')) return;
      fill(); v.hidden = false; history.pushState({ viewer: 1 }, '');
    });
    v.addEventListener('click', close);
    addEventListener('popstate', () => { v.hidden = true; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    // трек сменился, пока обложка открыта — обновляем
    new MutationObserver(() => { if (!v.hidden) fill(); }).observe($('cover'), { attributes: true, attributeFilter: ['src'] });
  }
  // Чат эфира: кнопка 💬 со счётчиком непрочитанных, панель снизу. Сообщения собирает и рассылает телефон ведущего.
  // Ссылки не делаем кликабельными — всё выводится как обычный текст.
  const Chat = (() => {
    const box = $('chat'), msgs = $('msgs'), badge = $('chatBadge'), input = $('chatInput');
    const mine = new Set();              // метки своих сообщений — чтобы подписать «ты»
    let lastId = 0, unread = 0, lastSend = 0, send = () => false;
    const isOpen = () => !box.hidden;
    const setBadge = () => { badge.hidden = !unread; badge.textContent = unread > 99 ? '99+' : unread; };
    function add(m) {
      if (!m || !m.text || m.id <= lastId) return false;
      lastId = m.id;
      const own = m.n && mine.has(m.n);
      const el = document.createElement('div');
      el.className = 'msg' + (m.host ? ' host' : '') + (own ? ' own' : '');
      const who = document.createElement('b');
      who.textContent = own ? 'Ты' : m.host ? 'Ведущий' : (m.name || 'Гость');
      const tx = document.createElement('span');
      tx.textContent = m.text;
      el.append(who, tx);
      const stick = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 60;
      msgs.appendChild(el);
      const all = msgs.querySelectorAll('.msg'); if (all.length > 200) all[0].remove();
      if (stick || own) msgs.scrollTop = msgs.scrollHeight;
      $('chatEmpty').hidden = true;
      return !own;
    }
    function open(on) {
      if (on === isOpen()) return;
      box.hidden = !on;
      if (on) {
        unread = 0; setBadge(); msgs.scrollTop = msgs.scrollHeight;
        history.pushState({ chat: 1 }, '');
        setTimeout(() => input.focus(), 50);
      } else if (history.state && history.state.chat) history.back();
    }
    $('chatBtn').onclick = e => { e.stopPropagation(); open(!isOpen()); };
    $('chatClose').onclick = () => open(false);
    addEventListener('popstate', () => { box.hidden = true; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen()) open(false); });
    $('chatForm').onsubmit = e => {
      e.preventDefault();
      const text = input.value.replace(/\s+/g, ' ').trim().slice(0, 200), now = Date.now();
      if (!text) return;
      if (now - lastSend < 1000) { $('chatHint').textContent = 'Не так быстро — не чаще раза в секунду'; return; }
      const n = Math.random().toString(36).slice(2, 12);
      if (!send({ type: 'chat', text, n })) { $('chatHint').textContent = 'Нет связи с ведущим'; return; }
      lastSend = now; mine.add(n); input.value = ''; $('chatHint').textContent = '';
    };
    return {
      setSend(f) { send = f; },
      message(m) { if (add(m) && !isOpen()) { unread++; setBadge(); } },
      history(items) { (items || []).forEach(add); },
      reset() { open(false); msgs.querySelectorAll('.msg').forEach(e => e.remove()); lastId = 0; unread = 0; setBadge(); $('chatEmpty').hidden = false; },
    };
  })();
  setupReactions(e => {
    const now = Date.now();
    if (!dc || dc.readyState !== 'open' || now - lastReact < 600) return false;
    lastReact = now; dc.send(JSON.stringify({ type: 'react', e })); return true;
  });
  setupViewer();
  Chat.setSend(o => { if (!dc || dc.readyState !== 'open') return false; dc.send(JSON.stringify(o)); return true; });

  function ui() {
    $('btn').className = wanted ? 'on' : '';
    $('btn').setAttribute('aria-label', wanted ? (waiting ? 'Отменить запрос' : 'Остановить') : 'Слушать');
    $('hint').textContent = !wanted ? (blocked ? 'Постучаться снова можно будет в следующем эфире. Если это ошибка — напиши ведущему.' : asked ? 'Жми и слушай' : 'Жми, чтобы попроситься в эфир')
      : waiting ? 'Ведущий увидит твоё имя и пустит в эфир. Страницу можно не закрывать.' : audio.srcObject && live ? 'Звук идёт' : 'Жду эфир — заиграет само';
    const mode = waiting && wanted ? 'knock' : blocked && !wanted ? 'nosig' : '';
    if (mode) document.body.dataset.mode = mode; else delete document.body.dataset.mode;
    if (live && pc && pc.connectionState === 'connected') setState(wanted ? 'Ты в эфире' : 'Эфир идёт');
  }

  async function play() {
    try { await audio.play(); tap(); }
    catch { wanted = false; $('hint').textContent = 'Нажми ещё раз'; }
    ui();
  }

  function tap() {   // анализатор для кольца; звук играет сам <audio>
    if (!audio.srcObject) return;
    try {
      tap.ctx = tap.ctx || new (window.AudioContext || window.webkitAudioContext)();
      tap.ctx.resume();
      if (tap.stream === audio.srcObject) return;
      if (tap.src) tap.src.disconnect();
      analyser = tap.ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = .6;
      bins = new Uint8Array(analyser.frequencyBinCount);
      tap.src = tap.ctx.createMediaStreamSource(tap.stream = audio.srcObject); tap.src.connect(analyser);
    } catch {}
  }

  $('btn').onclick = () => {
    wanted = !wanted;
    if (wanted && !asked) { asked = true; blocked = false; store('wc-name', $('name').value.trim()); join(); }
    if (wanted && audio.srcObject) return play();
    if (!wanted) audio.pause();
    ui();
  };
  $('vol').oninput = e => { audio.volume = +e.target.value; };
  $('share').onclick = async () => {
    const url = location.href;
    try { if (navigator.share) return await navigator.share({ title: 'WaveCast', text: 'Залетай в мой эфир', url }); } catch { return; }
    try { await navigator.clipboard.writeText(url); $('share').textContent = 'Ссылка скопирована'; setTimeout(() => $('share').textContent = 'Поделиться', 2000); } catch { prompt('Ссылка:', url); }
  };
  $('url').textContent = location.host + location.pathname;

  $('name').onkeydown = e => { if (e.key === 'Enter') $('btn').click(); };

  // шторка и экран блокировки: пауза/продолжить
  if ('mediaSession' in navigator) {
    const toggle = want => { if (wanted !== want) $('btn').click(); };
    for (const [a, f] of [['play', () => toggle(true)], ['pause', () => toggle(false)], ['stop', () => toggle(false)]])
      try { navigator.mediaSession.setActionHandler(a, f); } catch {}
    navigator.mediaSession.metadata = new MediaMetadata({ title: room, artist: 'WaveCast' });
  }
  // система могла поставить звук на паузу, пока страница была в фоне — продолжаем, если слушатель не нажимал стоп
  document.addEventListener('visibilitychange', () => { if (!document.hidden && wanted && audio.srcObject && audio.paused) play(); });
  audio.addEventListener('pause', () => { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; });
  audio.addEventListener('playing', () => { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

  ui();
  connect();
})();
</script>
</body>
</html>
