name = "wavecast"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
# главная идёт через воркер, чтобы добавить превью ссылки (og:-теги с полным адресом картинки)
run_worker_first = ["/"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Необязательно: TURN от Cloudflare для сетей, где прямое соединение не проходит (мобильный CGNAT).
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
