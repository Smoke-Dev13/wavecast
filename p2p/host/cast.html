<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>WaveCast host</title></head>
<body>
<pre id="log"></pre>
<script>
// Страница ведущего. Работает в скрытом WebView внутри Android-приложения:
// берёт PCM с локального сервера приложения (ws://127.0.0.1:<порт>/ws), превращает его
// в аудиодорожку и раздаёт слушателям напрямую по WebRTC (Opus кодирует сам движок).
//
// Параметры в #hash: signal=wss://host  room=<комната>  key=<ключ ведущего>
//                    src=ws://...  max=<слушателей>  bitrate=<бит/с>  auto=1 (пускать всех без вопросов)
//
// Запросы на вход: слушатель шлёт join с именем и id устройства (cid). Если cid ещё не пускали,
// приложение получает WaveCastHost.onRequest(id, name) и отвечает вызовом wcDecide(id, true|false).
// Пущенные и отклонённые cid запоминаются до конца эфира, повторно не спрашиваем.
//
// Канал данных «meta» к каждому слушателю (только к пущенным): ведущий шлёт {type:"track"} — что играет,
// слушатель шлёт {type:"react", e:"🔥"}; реакции расходятся остальным слушателям и в приложение.
// Приложение: wcTrack(json|null) — сменился трек, wcKick(id) — отключить слушателя.
// vid=ws://… — кадры клипа (JPEG) и {video:bool}/{pal:[…]} от приложения: видеодорожка и подсветка по кадру.
// В onState приходит people: [{id, name}] — кто сейчас слушает.
//
// Чат: слушатель шлёт {type:"chat", text, n}; страница передаёт его в приложение (onChat), приложение
// оформляет сообщение и рассылает обратно через wcChatOut(msg) всем — и по ссылке, и в Wi-Fi.
// wcHistory([...]) — последние сообщения, их получает каждый новый слушатель.
(() => {
  const P = new URLSearchParams(location.hash.slice(1));
  const signal = (P.get('signal') || '').replace(/^http/, 'ws').replace(/\/+$/, '');
  const room = P.get('room') || '', key = P.get('key') || '';
  const srcUrl = P.get('src') || `ws://${location.host}/ws`;
  const vidUrl = P.get('vid') || '';
  const MAX = +(P.get('max') || 30), BITRATE = +(P.get('bitrate') || 128000);
  const MAX_PENDING = 5;
  let auto = P.get('auto') === '1';
  const allowed = new Set(), denied = new Set();
  const pending = new Map();   // id слушателя → {name, cid}
  const RATE = 48000, CH = 2;

  const peers = new Map();   // id слушателя → RTCPeerConnection
  const meta = new Map();    // id слушателя → {name, cid, dc, lastReact}
  const EMOJI = ['🔥', '❤️', '😂', '👏', '🎉', '😍'];
  let nowPlaying = null;     // {title, artist, cover} или null
  let history = [];          // последние сообщения чата для новичков
  let sig, ice = [], track, stream, sigUp = false, error = null, retry = 500, fatal = false, lastStatus = '';

  const connected = () => [...peers.values()].filter(p => p.connectionState === 'connected').length;
  function report() {
    const people = [...peers.entries()].filter(([, p]) => p.connectionState === 'connected')
      .map(([id]) => ({ id, name: (meta.get(id) || {}).name || 'Гость' }));
    const s = { signal: sigUp, listeners: people.length, pending: peers.size - people.length, requests: pending.size, people, error };
    document.getElementById('log').textContent = JSON.stringify(s);
    try { window.WaveCastHost && window.WaveCastHost.onState(JSON.stringify(s)); } catch {}
    const st = JSON.stringify({ type: 'status', live: true, listeners: s.listeners });
    if (st !== lastStatus && sigUp) { lastStatus = st; send(JSON.parse(st)); }
  }
  const send = o => { if (sig && sig.readyState === 1) sig.send(JSON.stringify(o)); };

  // ---------- звук: PCM s16le → AudioWorklet (кольцевой буфер) → MediaStreamTrack ----------
  const WORKLET = `
  class Pcm extends AudioWorkletProcessor {
    constructor() {
      super();
      this.cap = ${RATE} * 2;                         // 2 с
      this.buf = [new Float32Array(this.cap), new Float32Array(this.cap)];
      this.r = 0; this.w = 0; this.fill = 0; this.primed = false;
      this.low = ${RATE} * 0.12; this.high = ${RATE} * 0.6;
      this.port.onmessage = e => {
        const pcm = new Int16Array(e.data), n = pcm.length >> 1;
        for (let i = 0; i < n; i++) {
          this.buf[0][this.w] = pcm[2 * i] / 32768; this.buf[1][this.w] = pcm[2 * i + 1] / 32768;
          this.w = (this.w + 1) % this.cap;
        }
        this.fill += n;
        if (this.fill > this.high) {                  // накопилась задержка: перескакиваем к свежему
          const skip = this.fill - this.low; this.r = (this.r + skip) % this.cap; this.fill -= skip;
        }
      };
    }
    process(_, outputs) {
      const out = outputs[0], n = out[0].length;
      if (!this.primed && this.fill >= this.low) this.primed = true;
      if (!this.primed || this.fill < n) { this.primed = false; return true; }   // тишина, пока буфер не наберётся
      for (let i = 0; i < n; i++) {
        out[0][i] = this.buf[0][this.r]; if (out[1]) out[1][i] = this.buf[1][this.r];
        this.r = (this.r + 1) % this.cap;
      }
      this.fill -= n;
      return true;
    }
  }
  registerProcessor('pcm', Pcm);`;

  async function startAudio() {
    const ctx = new AudioContext({ sampleRate: RATE, latencyHint: 'playback' });
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
    const node = new AudioWorkletNode(ctx, 'pcm', { numberOfInputs: 0, outputChannelCount: [CH] });
    const dest = ctx.createMediaStreamDestination();
    dest.channelCount = CH;
    node.connect(dest);
    await ctx.resume();
    stream = dest.stream; track = stream.getAudioTracks()[0];
    track.contentHint = 'music';
    (function pcm() {
      const ws = new WebSocket(srcUrl);
      ws.binaryType = 'arraybuffer';
      ws.onmessage = e => { if (typeof e.data !== 'string') node.port.postMessage(e.data, [e.data]); };
      ws.onclose = () => setTimeout(pcm, 1000);
    })();
  }

  // ---------- клип: JPEG-кадры с экрана → canvas → видеодорожка; подсветка по кадру ----------
  const vcv = document.createElement('canvas'); vcv.width = 640; vcv.height = 360;
  const vg = vcv.getContext('2d');
  let vtrack = null, videoOn = false, clipPal = null, drawing = false;
  function setVideo(on) {
    videoOn = on;
    for (const m of meta.values()) if (m.vt) m.vt.sender.replaceTrack(on ? vtrack : null).catch(() => {});
    toAll({ type: 'video', on });
    if (!on) clipPal = null;
  }
  if (vidUrl && vcv.captureStream) {
    vtrack = vcv.captureStream(12).getVideoTracks()[0];
    vtrack.contentHint = 'motion';
    (function vid() {
      const ws = new WebSocket(vidUrl);
      ws.binaryType = 'arraybuffer';
      ws.onmessage = async e => {
        if (typeof e.data === 'string') {
          try {
            const d = JSON.parse(e.data);
            if (typeof d.video === 'boolean' && d.video !== videoOn) setVideo(d.video);
            if (Array.isArray(d.pal)) { clipPal = d.pal; toAll({ type: 'pal', c: d.pal }); }
          } catch {}
          return;
        }
        if (drawing) return;                                  // не успеваем — пропускаем кадр
        drawing = true;
        try {
          const bmp = await createImageBitmap(new Blob([e.data], { type: 'image/jpeg' }));
          if (vcv.width !== bmp.width || vcv.height !== bmp.height) { vcv.width = bmp.width; vcv.height = bmp.height; }
          vg.drawImage(bmp, 0, 0); bmp.close();
        } catch {} finally { drawing = false; }
      };
      ws.onclose = () => { if (videoOn) setVideo(false); setTimeout(vid, 1000); };
    })();
  }

  // ---------- WebRTC ----------
  const musicSdp = sdp => sdp.replace(/a=fmtp:(\d+) (.*useinbandfec=1[^\r\n]*)/g,
    (s, pt, rest) => /stereo=1/.test(rest) ? s : `a=fmtp:${pt} ${rest};stereo=1;sprop-stereo=1;maxaveragebitrate=${BITRATE}`);

  function close(id) { const p = peers.get(id); if (p) { p.onconnectionstatechange = null; p.close(); peers.delete(id); } }

  const dcSend = (dc, o) => { try { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); } catch {} };
  const toAll = (o, except) => { for (const [id, m] of meta) if (id !== except) dcSend(m.dc, o); };

  // сообщения от слушателя по каналу данных
  function onData(id, d) {
    const m = meta.get(id);
    if (!m) return;
    if (d.type === 'chat') {
      const text = String(d.text || '').replace(/\s+/g, ' ').trim().slice(0, 200);
      const now = Date.now();
      if (!text || now - (m.lastChat || 0) < 1000) return;   // не чаще раза в секунду
      m.lastChat = now;
      bridge('onChat', id, m.name, text, String(d.n || '').slice(0, 24));
      return;
    }
    if (d.type !== 'react' || !EMOJI.includes(d.e)) return;
    const now = Date.now();
    if (now - (m.lastReact || 0) < 600) return;     // не чаще ~2 в секунду от одного слушателя
    m.lastReact = now;
    bridge('onReaction', m.name, d.e);
    toAll({ type: 'react', e: d.e, name: m.name }, id);
  }

  async function offer(id) {
    const old = peers.get(id);
    if (old && ['connected', 'connecting'].includes(old.connectionState)) return;   // уже слушает
    close(id);
    if (peers.size >= MAX) return send({ to: id, type: 'full' });
    const pc = new RTCPeerConnection({ iceServers: ice });
    peers.set(id, pc);
    const sender = pc.addTrack(track, stream);
    const m = meta.get(id) || { name: 'Гость', cid: id };
    meta.set(id, m);
    // видео-место есть всегда; картинка идёт, только пока на экране ведущего видеоплеер
    m.vt = vtrack ? pc.addTransceiver('video', { direction: 'sendonly', streams: [stream] }) : null;
    if (m.vt && videoOn) m.vt.sender.replaceTrack(vtrack).catch(() => {});
    m.dc = pc.createDataChannel('meta');
    m.dc.onopen = () => {
      if (nowPlaying) dcSend(m.dc, { type: 'track', ...nowPlaying });
      if (videoOn) { dcSend(m.dc, { type: 'video', on: true }); if (clipPal) dcSend(m.dc, { type: 'pal', c: clipPal }); }
      dcSend(m.dc, { type: 'chat-history', items: history });
    };
    m.dc.onmessage = e => { try { onData(id, JSON.parse(e.data)); } catch {} };
    pc.onicecandidate = e => { if (e.candidate) send({ to: id, type: 'ice', candidate: e.candidate }); };
    pc.onconnectionstatechange = () => {
      if (['failed', 'closed'].includes(pc.connectionState)) close(id);
      report();
    };
    const off = await pc.createOffer();
    off.sdp = musicSdp(off.sdp);
    await pc.setLocalDescription(off);
    const prm = sender.getParameters();
    if (prm.encodings && prm.encodings[0]) { prm.encodings[0].maxBitrate = BITRATE; sender.setParameters(prm).catch(() => {}); }
    if (m.vt) {                                                // клип: ~700 кбит/с, 12 к/с — экономно для мобильного интернета
      const vp = m.vt.sender.getParameters();
      if (vp.encodings && vp.encodings[0]) { vp.encodings[0].maxBitrate = 700000; vp.encodings[0].maxFramerate = 12; m.vt.sender.setParameters(vp).catch(() => {}); }
    }
    send({ to: id, type: 'offer', sdp: off.sdp });
    report();
  }

  async function onSignal(d) {
    const p = peers.get(d.from);
    switch (d.type) {
      case 'hello': ice = d.iceServers || []; break;
      case 'join': await onJoin(d); break;
      case 'answer': if (p && p.signalingState === 'have-local-offer') await p.setRemoteDescription({ type: 'answer', sdp: musicSdp(d.sdp) }); break;
      case 'ice': if (p && d.candidate) await p.addIceCandidate(d.candidate).catch(() => {}); break;
      case 'leave':
        close(d.from); meta.delete(d.from);
        if (pending.delete(d.from)) bridge('onRequestGone', d.from);
        report(); break;
      case 'error': fatal = true; error = d.message || d.code; report(); break;
    }
  }

  const bridge = (fn, ...a) => { try { window.WaveCastHost && window.WaveCastHost[fn](...a); } catch {} };

  async function onJoin(d) {
    const id = d.from, cid = d.cid || id, name = (d.name || 'Гость').slice(0, 24);
    meta.set(id, { ...(meta.get(id) || {}), name, cid });
    if (denied.has(cid)) return send({ to: id, type: 'denied' });   // отклонённых и отключённых не пускаем даже в режиме «всех»
    if (auto || allowed.has(cid)) return offer(id);
    if (pending.has(id)) return send({ to: id, type: 'waiting' });
    if (pending.size >= MAX_PENDING) return send({ to: id, type: 'busy' });
    pending.set(id, { name, cid });
    send({ to: id, type: 'waiting' });
    bridge('onRequest', id, name);
    report();
  }

  // вызывает приложение, когда ведущий нажал «Пустить» или «Отклонить»
  window.wcDecide = (id, allow) => {
    const r = pending.get(id);
    if (!r) return;
    pending.delete(id);
    (allow ? allowed : denied).add(r.cid);
    if (allow) offer(id); else send({ to: id, type: 'denied' });
    report();
  };
  // отключить слушателя: больше не пустим до конца эфира
  window.wcKick = id => {
    const m = meta.get(id);
    if (m) denied.add(m.cid);
    send({ to: id, type: 'kicked' });
    close(id); meta.delete(id);
    report();
  };
  // приложение сообщает, что играет: {"title","artist","cover"(data:)} или null
  window.wcTrack = t => {
    nowPlaying = t && t.title ? { title: t.title, artist: t.artist || '', cover: t.cover || '', genre: t.genre || '', theme: t.theme || '' } : null;
    toAll({ type: 'track', ...(nowPlaying || { title: null }) });
  };
  // чат: приложение рассылает готовое сообщение и обновляет историю для новичков
  window.wcChatOut = msg => toAll({ type: 'chat', ...msg });
  window.wcHistory = items => { history = Array.isArray(items) ? items : []; };
  window.wcAuto = on => {
    auto = !!on;
    if (auto) for (const id of [...pending.keys()]) window.wcDecide(id, true);
  };

  function connect() {
    sig = new WebSocket(`${signal}/signal/${encodeURIComponent(room)}?role=host&key=${encodeURIComponent(key)}`);
    sig.onopen = () => { sigUp = true; error = null; retry = 500; lastStatus = ''; report(); };
    sig.onmessage = e => onSignal(JSON.parse(e.data)).catch(err => console.warn('signal', err));
    sig.onclose = e => {
      sigUp = false;
      if (e.code === 4001) { fatal = true; error = 'эфир в этой комнате запущен с другого устройства'; }
      else if (!fatal) { error = 'нет связи с сервисом'; setTimeout(connect, retry); retry = Math.min(retry * 2, 10000); }
      report();   // уже подключённые слушатели продолжают слышать: звук идёт напрямую
    };
  }

  if (!signal || !room || !key) { error = 'не заданы signal/room/key'; report(); return; }
  startAudio().then(connect).catch(e => { error = 'звук: ' + e.message; report(); });
  setInterval(report, 3000);
})();
</script>
</body>
</html>
